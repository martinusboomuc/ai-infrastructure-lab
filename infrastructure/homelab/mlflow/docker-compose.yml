services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      # ADR-0013's decided design: artifacts on Azure Blob, not this host's disk, so a homelab
      # disk failure can't take the only copy of a registered model with it. Still accessed only
      # through the server's own proxy (--default-artifact-root mlflow-artifacts:/ below) — a
      # remote client (a laptop, the deployed Container App) never talks to Azure directly, only
      # MLflow's own HTTP API does, same as before this changed from a local volume.
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
    # --allowed-hosts: MLflow 3 rejects any Host header outside localhost and private IPs, as a
    # DNS rebinding guard. Setting the list replaces that default, so it names every way this
    # server is reached: localhost:5000 (training on this host, and the Cloudflare Tunnel, which
    # rewrites Host to it), the LAN IP, and the hostname and Tailscale address that Nexus links
    # to. The tailnet range (100.64.0.0/10) is not private, so it is refused by default.
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination wasbs://mlflow-artifacts@bankmldvcstore.blob.core.windows.net/
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts localhost,localhost:5000,127.0.0.1:5000,192.168.1.115:5000,docker-01:5000,docker-01.tailfb8c1f.ts.net:5000,100.127.8.10:5000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  # Not a long-running service: the `backup` profile keeps it out of `docker compose up`. The
  # mlflow-backup systemd timer runs it once a day (docs/decisions/0004). It reaches Postgres over
  # this stack's own network, so the database is never published on the host.
  backup:
    profiles: ["backup"]
    build: ./backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_CONTAINER_URL: https://bankmldvcstore.blob.core.windows.net/backups
      BACKUP_SAS_TOKEN: ${BACKUP_SAS_TOKEN}
      PUSHGATEWAY_URL: http://192.168.1.136:9091
    tmpfs:
      - /tmp

volumes:
  postgres-data:
