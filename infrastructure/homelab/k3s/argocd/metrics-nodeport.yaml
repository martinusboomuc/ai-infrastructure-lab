# The application controller's metrics (sync and health state of every Application), on a fixed
# NodePort for Prometheus on monitoring-01. The upstream `argocd-metrics` Service is ClusterIP,
# which has no meaning outside the cluster; this is the same arrangement as kube-state-metrics
# on 30080.
apiVersion: v1
kind: Service
metadata:
  name: argocd-metrics-nodeport
  labels:
    app.kubernetes.io/name: argocd-metrics-nodeport
    app.kubernetes.io/part-of: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-application-controller
  ports:
    - name: metrics
      port: 8082
      targetPort: 8082
      nodePort: 30082
