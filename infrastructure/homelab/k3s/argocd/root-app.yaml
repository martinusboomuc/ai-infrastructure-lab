# The one Application applied by hand. It owns every Application in apps/, so adding a workload to
# GitOps is a new file there, not a kubectl command.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/martinusboomuc/ai-infrastructure-lab.git
    targetRevision: main
    path: infrastructure/homelab/k3s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
