# Argo CD manages its own installation, so an upgrade is a commit to ../kustomization.yaml.
# Pruning is off here: a mistake in that directory should leave Argo CD running, not remove it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/martinusboomuc/ai-infrastructure-lab.git
    targetRevision: main
    path: infrastructure/homelab/k3s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    # The ApplicationSet CRD is larger than the 256 KB last-applied annotation client-side apply
    # writes, so syncing it failed on 2026-11-15. Server-side apply keeps no such annotation.
    syncOptions:
      - ServerSideApply=true
