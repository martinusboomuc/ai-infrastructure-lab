services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - pushgateway
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"

  # `bankml.monitoring.drift` is a one-shot batch job (`make drift`), not a long-running server —
  # Prometheus's own pull model has nothing to scrape between runs. The Pushgateway is the
  # standard bridge: the job pushes once when it finishes, Prometheus scrapes the gateway (below)
  # on its normal interval like any other target.
  pushgateway:
    image: prom/pushgateway:v1.11.0
    restart: unless-stopped
    # Without a persistence file, a restart forgets every pushed metric, and the staleness alerts
    # for the drift job and the backups fire until each job next runs. /pushgateway is the image's
    # working directory and already owned by its `nobody` user, so the volume inherits that.
    command:
      - --persistence.file=/pushgateway/metrics.db
      - --persistence.interval=1m
    volumes:
      - pushgateway-data:/pushgateway
    ports:
      - "9091:9091"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read by grafana/provisioning/alerting/notifications.yaml. `:?` makes Compose refuse to
      # start rather than provision an empty webhook over a working one.
      DISCORD_BANKML_WEBHOOK_URL: ${DISCORD_BANKML_WEBHOOK_URL:?set in .env, see README}
      DISCORD_HOMELAB_WEBHOOK_URL: ${DISCORD_HOMELAB_WEBHOOK_URL:?set in .env, see README}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  prometheus-data:
  pushgateway-data:
  grafana-data:
