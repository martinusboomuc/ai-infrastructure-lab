global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter runs as a systemd service directly on each VM (not in Docker), installed by
  # hand per infrastructure/homelab/monitoring/README.md, one job per host so Grafana can filter
  # and label by instance role instead of a single generic "node" job.
  - job_name: node-k8s-01
    static_configs:
      - targets: ["192.168.1.183:9100"]
        labels:
          role: k8s-01

  - job_name: node-docker-01
    static_configs:
      - targets: ["192.168.1.115:9100"]
        labels:
          role: docker-01

  - job_name: node-monitoring-01
    static_configs:
      - targets: ["192.168.1.136:9100"]
        labels:
          role: monitoring-01

  # The Proxmox host itself (pve01) — everything else in the homelab runs on top of it, so it's
  # the single most consequential machine to have visibility into, not an afterthought. Reached
  # over its Tailscale address (100.115.148.123), not the LAN, since monitoring-01 has no other
  # documented route to it that isn't also the LAN IP a DHCP renewal could change under it.
  - job_name: node-proxmox
    static_configs:
      - targets: ["100.115.148.123:9100"]
        labels:
          role: proxmox

  # The deployed BankML serving app itself, over the public internet — its /metrics endpoint has
  # no authentication of its own (same exposure the app's existing /health and /predict/credit
  # endpoints already have; see infrastructure/homelab/monitoring/README.md's "What's still open").
  - job_name: bankml-credit-serving
    scheme: https
    static_configs:
      - targets: ["bankml-credit-serving.delightfulgrass-66b6c9e3.spaincentral.azurecontainerapps.io"]
        labels:
          role: bankml-credit-serving

  # bankml.monitoring.drift (a batch job, `make drift`) pushes here after each run — see
  # docker-compose.yml's own comment on why a Pushgateway exists at all for a one-shot job.
  # `honor_labels: true` keeps the job/instance labels the push itself set instead of Prometheus
  # overwriting them with the scrape target's own — otherwise every pushed metric would show up
  # labeled as if it came from "pushgateway" itself, losing which domain's drift run it was.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
