global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter runs as a systemd service directly on each VM (not in Docker), installed by
  # hand per infrastructure/homelab/monitoring/README.md, one job per host so Grafana can filter
  # and label by instance role instead of a single generic "node" job.
  - job_name: node-k8s-01
    static_configs:
      - targets: ["192.168.1.183:9100"]
        labels:
          role: k8s-01

  - job_name: node-docker-01
    static_configs:
      - targets: ["192.168.1.115:9100"]
        labels:
          role: docker-01

  - job_name: node-monitoring-01
    static_configs:
      - targets: ["192.168.1.136:9100"]
        labels:
          role: monitoring-01

  # The Proxmox host itself (pve01) — everything else in the homelab runs on top of it, so it's
  # the single most consequential machine to have visibility into, not an afterthought. Reached
  # over its Tailscale address (100.115.148.123), not the LAN, since monitoring-01 has no other
  # documented route to it that isn't also the LAN IP a DHCP renewal could change under it.
  - job_name: node-proxmox
    static_configs:
      - targets: ["100.115.148.123:9100"]
        labels:
          role: proxmox

  # Per-container metrics on docker-01 (infrastructure/homelab/cadvisor/docker-compose.yml) —
  # the node_exporter jobs above see the host's aggregate CPU/memory/disk, not which container
  # is actually responsible for it.
  - job_name: cadvisor
    static_configs:
      - targets: ["192.168.1.115:8080"]
        labels:
          role: docker-01

  # Pod/deployment-level cluster state on k8s-01 (infrastructure/homelab/k3s/kube-state-metrics/
  # kube-state-metrics.yaml) — exposed via NodePort 30080 since Prometheus runs outside the k3s
  # cluster entirely, on a separate VM; the upstream Service is ClusterIP-only and unreachable
  # from there.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["192.168.1.183:30080"]
        labels:
          role: k8s-01

  # Argo CD's application controller on k8s-01 (infrastructure/homelab/k3s/argocd/
  # metrics-nodeport.yaml): argocd_app_info carries each Application's sync and health status,
  # which the homelab-argocd-app-unhealthy alert reads.
  - job_name: argocd
    static_configs:
      - targets: ["192.168.1.183:30082"]
        labels:
          role: k8s-01

  # The deployed BankML serving app itself, over the public internet — its /metrics endpoint has
  # no authentication of its own (same exposure the app's existing /health and /predict/credit
  # endpoints already have; see infrastructure/homelab/monitoring/README.md's "What's still open").
  - job_name: bankml-credit-serving
    # Hourly, not the global 15s. The Container App scales to zero, and every scrape is a request
    # that wakes it and keeps a replica billed until the idle cool-down ends: at 15s it never
    # scaled down, and cost about 10 EUR a month (2026-11-25). Hourly keeps it inside the free
    # grant. Queries over this job use last_over_time(...[2h]) or a 2h range, because an instant
    # query only looks back 5 minutes. The timeout covers a cold start, which loads both models
    # (Credit Risk and Fraud) from MLflow and took over 60 s on 2026-11-25.
    scrape_interval: 1h
    scrape_timeout: 150s
    scheme: https
    # /metrics needs the `prometheus` client key (mlops ADR-0017). The key is a file on this
    # host only, mounted by docker-compose.yml, never in the repository.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/bankml-api-key
    static_configs:
      - targets: ["bankml-credit-serving.delightfulgrass-66b6c9e3.spaincentral.azurecontainerapps.io"]
        labels:
          role: bankml-credit-serving

  # bankml.monitoring.drift (a batch job, `make drift`) pushes here after each run — see
  # docker-compose.yml's own comment on why a Pushgateway exists at all for a one-shot job.
  # `honor_labels: true` keeps the job/instance labels the push itself set instead of Prometheus
  # overwriting them with the scrape target's own — otherwise every pushed metric would show up
  # labeled as if it came from "pushgateway" itself, losing which domain's drift run it was.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
