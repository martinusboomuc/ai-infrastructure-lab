apiVersion: 1

groups:
  - orgId: 1
    name: bankml-drift
    folder: BankML
    interval: 1m
    rules:
      - uid: bankml-drift-detected
        title: BankML drift detected
        condition: C
        # A: the raw metric over the last 10m; B: reduce to its last value; C: threshold check.
        # Grafana's own multi-query alerting shape — each letter is a step, C is what "condition"
        # above points at as the actual pass/fail.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max(bankml_drift_dataset_drift)
              instant: false
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            Either input or prediction drift crossed its configured PSI threshold on the most
            recent `make drift` run. Check the logged MLflow run
            (`<domain>-monitoring` experiment) for per-feature PSI values.

      - uid: bankml-drift-job-stale
        title: BankML drift job has not run recently
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: time() - max(bankml_drift_last_run_timestamp_seconds)
              instant: false
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              # 2 days — this is a batch job with no schedule of its own yet (run by hand via
              # `make drift`), not a continuously-running service; the point of this rule is
              # catching "nobody's been running it," not enforcing a real SLA.
              conditions:
                - evaluator:
                    type: gt
                    params: [172800]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: info
        annotations:
          summary: >-
            No successful `make drift` run has pushed metrics in over 2 days (or ever, if this
            fires immediately on a fresh deploy — NoData is treated as alerting on purpose, since
            "never run" and "stopped running" both mean the same thing: nothing is watching for
            drift right now).
