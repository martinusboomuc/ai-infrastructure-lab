apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: nexus-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/martinusboomuc/ai-infrastructure-lab/nexus-frontend
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          # The stock nginx image starts as root to bind port 80 and then drops to its worker
          # user, so this container cannot yet run as non-root like the backend does.
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: nexus-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
