# Runs the full stack on one Docker host, for local testing. Production runs on k3s instead, from
# the manifests in deploy/k8s/ (docs/decisions/0003).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    # No published port: nginx (the frontend container) reverse-proxies /api/ to this service by
    # its Compose service name over the internal Docker network — nothing external needs to reach
    # this directly, so it isn't exposed to the LAN/tailnet at all.
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://192.168.1.136:9090}
      # Read-only Tailscale OAuth client. Put both in nexus/.env, which is git-ignored.
      TS_OAUTH_CLIENT_ID: ${TS_OAUTH_CLIENT_ID:?set in nexus/.env}
      TS_OAUTH_CLIENT_SECRET: ${TS_OAUTH_CLIENT_SECRET:?set in nexus/.env}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # 8080 is already cAdvisor's port on docker-01 (infrastructure/homelab/cadvisor/) — found
      # the hard way, by silently hitting cAdvisor's own web UI instead of this frontend.
      - "8081:80"
