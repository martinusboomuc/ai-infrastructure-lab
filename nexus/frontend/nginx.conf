server {
    listen 80;

    location /api/ {
        # `backend` resolves via Docker Compose's own DNS — both services are in the same
        # compose project, so this works identically regardless of what hostname/IP a browser
        # used to reach nginx itself (LAN, Tailscale, or eventually the public domain). This is
        # what makes VITE_API_BASE unnecessary: the frontend's own JS only ever calls a relative
        # `/api/...` path, never a specific address baked in at build time.
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
