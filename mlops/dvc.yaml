stages:
  features_credit:
    cmd: uv run python -m bankml.features.credit.pipeline
    deps:
      - src/bankml/features/credit
      - src/bankml/splitting.py
      - src/bankml/validation/credit
      - configs/credit.yaml
      - data/raw/credit
    outs:
      - data/processed/credit/features.parquet
  features_fraud:
    cmd: uv run python -m bankml.features.fraud.pipeline
    deps:
      - src/bankml/features/fraud
      - src/bankml/splitting.py
      - src/bankml/validation/fraud
      - configs/fraud.yaml
      - data/raw/fraud
    outs:
      - data/processed/fraud/features.parquet
