# Credit Risk domain config.

domain: credit

entity_key: SK_ID_CURR
target: TARGET

raw_data:
  directory: raw/credit/ # under $BANKML_DATA_ROOT
  tables:
    - application_train.csv
    - bureau.csv
    - bureau_balance.csv
    - previous_application.csv
    - POS_CASH_balance.csv
    - installments_payments.csv
    - credit_card_balance.csv

# ADR-0008: no real application date exists anywhere in the raw data. Every DAYS_*/
# MONTHS_BALANCE column across all 7 tables (confirmed against HomeCredit_columns_description.csv)
# is relative to this one synthetic per-SK_ID_CURR anchor, not to each other. APPLICATION_DATE is
# constructed by ranking applications by SK_ID_CURR ascending and linearly mapping rank onto this
# window. These are not real Home Credit application dates.
synthetic_anchor:
  start: 2016-01-01
  end: 2018-06-30

# ADR-0004: chronological split with an explicit gap window. Dates are synthetic (see
# synthetic_anchor / ADR-0008) — window reused verbatim from ARCHITECTURE.md's own example.
split:
  train:
    from: 2016-01-01
    to: 2017-06-30
  gap_days: 30
  validation:
    from: 2017-08-01
    to: 2017-12-31
  test:
    from: 2018-01-01
    to: 2018-06-30

# ADR-0004: label maturity window. 540 days (~18 months) sits within ADR-0004's cited
# 12-24 month range for default risk, and matches ARCHITECTURE.md's own example.
#
# as_of is deliberately NOT synthetic_anchor.end. "as_of" means "today, when we're evaluating" —
# using anchor.end (the last synthetic application date) would mean "today = the moment data
# collection stopped", which makes the mature cutoff (as_of - maturity_days) land at 2017-01-06,
# strictly before the validation window even starts (2017-08-01) — every validation and test row
# would be immature, leaving nothing to evaluate on. Found by actually running Phase 3 Stage 1's
# training pipeline, not caught by inspection. Real evaluation always happens after data
# collection stopped, so as_of is modeled as meaningfully later than anchor.end — chosen so the
# resulting cutoff (2018-04-08) falls inside the test window, giving train/validation entirely
# mature and test a genuine mature/immature mix, rather than either extreme (0% or 100% mature).
label:
  maturity_days: 540
  as_of: 2019-09-30

# Values with a special meaning other than their literal number. 365243 is Home Credit's
# generic "not applicable" placeholder for a DAYS_* column, not unique to DAYS_EMPLOYED —
# found in Phase 2 Stage 3 by inspecting the real files, and not previously documented here
# or in docs/datasets/README.md. Every column below actually carries the sentinel in the raw
# data; it is intentionally not rejected or coerced by the Pandera contracts in
# src/bankml/validation/credit/ — sentinel handling is feature-pipeline work for a later stage.
sentinel_values:
  application_train:
    DAYS_EMPLOYED: 365243 # means "not employed"
  previous_application:
    DAYS_FIRST_DRAWING: 365243
    DAYS_FIRST_DUE: 365243
    DAYS_LAST_DUE_1ST_VERSION: 365243
    DAYS_LAST_DUE: 365243
    DAYS_TERMINATION: 365243

# ADR-0005: WoE scorecard is champion, LightGBM is challenger for Credit Risk (reversed for
# Fraud). Config-driven so src/bankml/training/ stays a generic, domain-agnostic mechanism.
modelling:
  champion: scorecard
  challenger: lightgbm

# Phase 3: cost-sensitive evaluation and slice tolerances. Provisional — no real business input
# exists for a portfolio project; illustrative, not invented precision. Revisit if this project
# ever needs to reflect a real bank's actual risk appetite.
evaluation:
  cost_of_miss: 10 # cost units, missing an actual defaulter
  cost_of_review: 1 # cost units, reviewing a false positive
  target_fpr: 0.05
  alert_budget_fraction: 0.10 # top decile by risk score
  slices:
    - column: CODE_GENDER
      tolerance: 0.05 # max allowed PR-AUC drop on any slice value vs. overall
    - column: NAME_EDUCATION_TYPE
      tolerance: 0.05
