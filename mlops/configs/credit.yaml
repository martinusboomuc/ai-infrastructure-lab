# Credit Risk domain config.
#
# Numeric thresholds marked "provisional" are placeholders pending real EDA once the raw
# data exists locally (Phase 2, Stage 3). They are not fabricated precision — they are a
# starting point to unblock the config schema and the split/feature code that reads it.

domain: credit

entity_key: SK_ID_CURR
target: TARGET

raw_data:
  directory: raw/credit/ # under $BANKML_DATA_ROOT
  tables:
    - application_train.csv
    - bureau.csv
    - bureau_balance.csv
    - previous_application.csv
    - POS_CASH_balance.csv
    - installments_payments.csv
    - credit_card_balance.csv

# Home Credit's timestamps are relative day-offsets (DAYS_BIRTH, DAYS_DECISION, ...), not
# real dates. There is no true "application date" in the raw data, so this project needs a
# synthetic anchor to turn day-offsets into an as-of timestamp axis. The anchor policy below
# is a placeholder — finalized once the real columns are inspected (Phase 2, Stage 3).
temporal:
  anchor_policy: provisional # e.g. a fixed reference date the DAYS_* offsets count backward from
  decision_timestamp_column: DAYS_DECISION # on previous_application; main table's own as-of
                                            # timestamp still needs deciding in Stage 3

# ADR-0004: chronological split with an explicit gap window, and a label maturity window.
gap_window_days: 90 # provisional
label_maturity_days: 365 # provisional; ADR-0004 cites 12-24 months for default risk

# Values with a special meaning other than their literal number. 365243 is Home Credit's
# generic "not applicable" placeholder for a DAYS_* column, not unique to DAYS_EMPLOYED —
# found in Phase 2 Stage 3 by inspecting the real files, and not previously documented here
# or in docs/datasets/README.md. Every column below actually carries the sentinel in the raw
# data; it is intentionally not rejected or coerced by the Pandera contracts in
# src/bankml/validation/credit/ — sentinel handling is feature-pipeline work for a later stage.
sentinel_values:
  application_train:
    DAYS_EMPLOYED: 365243 # means "not employed"
  previous_application:
    DAYS_FIRST_DRAWING: 365243
    DAYS_FIRST_DUE: 365243
    DAYS_LAST_DUE_1ST_VERSION: 365243
    DAYS_LAST_DUE: 365243
    DAYS_TERMINATION: 365243
