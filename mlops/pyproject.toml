[project]
name = "bankml"
version = "0.1.0"
description = "BankML Platform: a production-inspired MLOps platform for banking ML"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc[azure]>=3.67.1",
    "fastapi>=0.118.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "optbinning>=1.0.0",
    "pandera[pandas]>=0.33.1",
    "prefect>=3.4.24",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.38.0",
]

[project.entry-points."mlflow.request_header_provider"]
# See src/bankml/tracking_auth.py's docstring for why this exists.
cloudflare_access = "bankml.tracking_auth:CloudflareAccessRequestHeaderProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankml"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# See docs/decisions/0004-temporal-validation.md: random splits are banned in src/.
"sklearn.model_selection.train_test_split".msg = "Use a chronological split from bankml's own split module, not a random one."
"sklearn.model_selection.KFold".msg = "Use a chronological split from bankml's own split module, not a random one."
"sklearn.model_selection.StratifiedKFold".msg = "Use a chronological split from bankml's own split module, not a random one."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
